name: CI
on:
  push:
    branches: [main, "batch/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Resolve module checksums
        run: go mod tidy
      - name: Print module checksums for lockfile review
        run: cat go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o /tmp/nmp-snmp ./cmd/nmp-snmp
